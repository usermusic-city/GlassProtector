name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug & Release APK
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Sign release APK (CI keystore)
        run: |
          set -e
          APK_UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$APK_UNSIGNED" ]; then
            APK_UNSIGNED="app/build/outputs/apk/release/app-release.apk"
          fi
          keytool -genkeypair -v \
            -keystore ci.keystore -alias ci \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass glassprotector -keypass glassprotector \
            -dname "CN=GlassProtector CI, O=GlassProtector, C=US"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            APKSIGNER="$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner"
          fi
          "$APKSIGNER" sign \
            --ks ci.keystore --ks-pass pass:glassprotector \
            --key-pass pass:glassprotector \
            --out "app/build/outputs/apk/release/GlassProtector-release.apk" \
            "$APK_UNSIGNED"
          "$APKSIGNER" verify --print-certs "app/build/outputs/apk/release/GlassProtector-release.apk"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GlassProtector-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: GlassProtector-release
          path: app/build/outputs/apk/release/GlassProtector-release.apk
          if-no-files-found: error

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/GlassProtector-release.apk
            app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
