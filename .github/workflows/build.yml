name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ============ 阶段 1：构建 Glass 壳 dex（shell-runtime） ============

      - name: Build shell-runtime DEX
        run: |
          chmod +x gradlew
          ./gradlew :shell-runtime:assembleRelease --no-daemon
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          rm -rf /tmp/aar && mkdir -p /tmp/aar
          cd /tmp/aar
          unzip -o "$OLDPWD/shell-runtime/build/outputs/aar/shell-runtime-release.aar" classes.jar
          "$BT/d8" --release --min-api 24 --output . classes.jar
          mv classes.dex "$OLDPWD/app/src/main/assets/shell.dex"
          cd "$OLDPWD"
          ls -la app/src/main/assets/shell.dex

      # ============ 阶段 1.5：生成 junk.dex（垃圾代码注入载荷） ============

      - name: Generate junk.dex (junk code payload)
        run: |
          rm -rf /tmp/junk && mkdir -p /tmp/junk/classes
          python3 scripts/gen_junk.py > /tmp/junk/Junk.java
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          javac --release 8 -nowarn -d /tmp/junk/classes /tmp/junk/Junk.java
          "$BT/d8" --release --min-api 24 --output /tmp/junk /tmp/junk/classes/*.class
          mv /tmp/junk/classes.dex app/src/main/assets/junk.dex
          ls -la app/src/main/assets/junk.dex

      # ============ 阶段 2：构建 GlassProtector APK ============

      - name: Build GlassProtector APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlassProtector-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
